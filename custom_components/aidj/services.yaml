start:
  name: Start
  description: Resume playback on the configured media player.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Reserved for future multi-station support; omit this field in milestone 2.
      required: false
      example: 01J...
      selector:
        text:
stop:
  name: Stop
  description: Stop playback on the configured media player.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Reserved for future multi-station support; omit this field in milestone 2.
      required: false
      example: 01J...
      selector:
        text:
queue_add:
  name: Add to queue
  description: Add one media item to the configured Music Assistant queue without replacing it.
  fields:
    media_id:
      name: Media ID
      description: A Music Assistant URI or searchable media name.
      required: true
      example: spotify://track/1234567890
      selector:
        text:
    config_entry_id:
      name: Config entry ID
      description: Reserved for future multi-station support.
      required: false
      example: 01J...
      selector:
        text:
announce:
  name: Announce
  description: Speak a one-shot DJ announcement on the configured player immediately.
  fields:
    message:
      name: Message
      description: The message to speak.
      required: true
      example: This is Escondido Smart Home Radio.
      selector:
        text:
    config_entry_id:
      name: Config entry ID
      description: Reserved for future multi-station support; omit this field in milestone 1.
      required: false
      example: 01J...
      selector:
        text:
briefing:
  name: Prepare briefing
  description: Generate a briefing from a Home Assistant weather entity without speaking or changing playback.
  fields:
    weather_entity_id:
      name: Weather entity
      description: The Home Assistant weather entity to summarize. Uses the configured option when omitted.
      required: false
      example: weather.forecast_home
      selector:
        entity:
          domain: weather
    agent_id:
      name: Conversation agent
      description: The Home Assistant conversation agent to generate the briefing. Uses the configured option when omitted.
      required: false
      example: conversation.openai_conversation
      selector:
        conversation_agent:
    prompt:
      name: Prompt
      description: Optional instruction for the briefing style.
      required: false
      example: Write one concise sentence for radio.
      selector:
        text:
    config_entry_id:
      name: Config entry ID
      description: Reserved for future multi-station support.
      required: false
      example: 01J...
      selector:
        text:
briefing_next:
  name: Briefing at next track
  description: Generate a weather briefing and insert it as the next Music Assistant queue item when native transport is configured; otherwise speak it after the next different track starts.
  fields:
    weather_entity_id:
      name: Weather entity
      description: The Home Assistant weather entity to summarize. Uses the configured option when omitted.
      required: false
      example: weather.forecast_home
      selector:
        entity:
          domain: weather
    agent_id:
      name: Conversation agent
      description: The Home Assistant conversation agent to generate the briefing. Uses the configured option when omitted.
      required: false
      example: conversation.openai_conversation
      selector:
        conversation_agent:
    prompt:
      name: Prompt
      description: Optional instruction for the briefing style.
      required: false
      example: Write one concise sentence for radio.
      selector:
        text:
    config_entry_id:
      name: Config entry ID
      description: Reserved for future multi-station support.
      required: false
      example: 01J...
      selector:
        text:
announce_next:
  name: Announce at next track
  description: Queue an announcement for the next different track on the configured player.
  fields:
    message:
      name: Message
      description: The message to speak after the current track changes.
      required: true
      example: Coming up next on Escondido Smart Home Radio.
      selector:
        text:
    config_entry_id:
      name: Config entry ID
      description: Reserved for future multi-station support.
      required: false
      example: 01J...
      selector:
        text:
